name: Fiscal cycle (synthetic)
on:
  push:
    branches: [feat/professional-invoice-pdf, feat/prefactura-pdf-download, feat/invoice-numbering, fix/proposal-quote-sync, fix/quote-edit-access, fix/commercial-date-override, fix/quote-creation-history, fix/quote-creation-context, fix/fiscal-mvp-acceptance, fix/fiscal-stamp-recovery, feat/fiscal-payment-cancellation, feat/ppd-production-release, feat/fiscal-general-production, feat/fiscal-classification-aup, fix/prefactura-guided-readiness, fix/fiscal-classification-resume, fix/sat-validation-contract, fix/fiscal-history-without-won, fix/cancelled-invoice-presentation, fix/fiscal-state-provenance, fix/csf-explicit-read-progress, feat/sat-status-evidence, feat/sat-periodic-tracking]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix cotiza-web run db:generate
      - run: ./cotiza-web/node_modules/.bin/tsc --noEmit --project cotiza-web/tsconfig.json
      - run: npm --prefix cotiza-web test -- --maxWorkers=2 --exclude validate-quote-lifecycle.e2e.test.ts --reporter=dot
  classification-visual:
    if: github.ref == 'refs/heads/feat/sat-periodic-tracking' || github.ref == 'refs/heads/fix/quote-creation-history' || github.ref == 'refs/heads/fix/quote-creation-context' || github.ref == 'refs/heads/fix/fiscal-mvp-acceptance' || github.ref == 'refs/heads/feat/sat-status-evidence' || github.ref == 'refs/heads/fix/csf-explicit-read-progress' || github.ref == 'refs/heads/fix/fiscal-state-provenance' || github.ref == 'refs/heads/fix/cancelled-invoice-presentation' || github.ref == 'refs/heads/fix/fiscal-history-without-won' || github.ref == 'refs/heads/fix/fiscal-stamp-recovery' || github.ref == 'refs/heads/feat/fiscal-classification-aup' || github.ref == 'refs/heads/fix/prefactura-guided-readiness' || github.ref == 'refs/heads/fix/fiscal-classification-resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/fiscal-ui-tools" --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check actual fiscal components with synthetic HTTP fixtures
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_fiscal_classification_ui.mjs
      - name: Check unknown result and UUID recovery in desktop/mobile
        if: github.ref == 'refs/heads/fix/fiscal-stamp-recovery'
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_invoice_recovery_ui.mjs
      - name: Check cancelled invoice history in desktop/mobile
        if: github.ref == 'refs/heads/fix/fiscal-mvp-acceptance' || github.ref == 'refs/heads/fix/fiscal-state-provenance' || github.ref == 'refs/heads/fix/cancelled-invoice-presentation'
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_cancelled_invoice_ui.mjs
      - name: Check payment and REP follow-up without fiscal writes
        if: github.ref == 'refs/heads/fix/fiscal-mvp-acceptance'
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_payment_follow_up_ui.mjs
      - name: Check explicit CSF reader in desktop/mobile
        if: github.ref == 'refs/heads/fix/csf-explicit-read-progress'
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_csf_read_ui.mjs
      - name: Check SAT observation flow in desktop/mobile
        if: github.ref == 'refs/heads/feat/sat-status-evidence' || github.ref == 'refs/heads/feat/sat-periodic-tracking'
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_sat_status_ui.mjs
      - name: Check new quote context in desktop/mobile
        if: github.ref == 'refs/heads/fix/quote-creation-history' || github.ref == 'refs/heads/fix/quote-creation-context'
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiscal-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_quote_creation_context_ui.mjs
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fiscal-classification-visual
          path: |
            artifacts/fiscal-classification
            artifacts/invoice-recovery
            artifacts/invoice-cancelled
            artifacts/csf-read
            artifacts/sat-status
            artifacts/payment-follow-up
            artifacts/quote-context
          retention-days: 3
          if-no-files-found: warn

  preparation-persistence:
    if: github.ref == 'refs/heads/fix/fiscal-history-without-won' || github.ref == 'refs/heads/fix/fiscal-stamp-recovery' || github.ref == 'refs/heads/fix/fiscal-classification-resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: cotiza_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:synthetic-local-only@127.0.0.1:5432/cotiza_synthetic
      COTIZA_TEST_DATABASE_URL: postgresql://postgres:synthetic-local-only@127.0.0.1:5432/cotiza_synthetic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix cotiza-web run db:generate
      - name: Initialize disposable schema
        working-directory: cotiza-web
        run: |
          ./node_modules/.bin/prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > "$RUNNER_TEMP/schema.sql"
          SCHEMA_PATH="$RUNNER_TEMP/schema.sql" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try { await client.query(readFileSync(process.env.SCHEMA_PATH, 'utf8')); }
          finally { await client.end(); }
          JS
      - name: Confirm preparation persists, isolates identities, and rolls back on failure
        run: npm --prefix cotiza-web test -- lib/db/invoice-preparations.integration.test.ts lib/db/proposal-invoices.integration.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Checkout exact synthetic Digestor implementation
        if: github.ref == 'refs/heads/fix/fiscal-stamp-recovery'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: B10sp4rt4n/digestor__fiscal
          ref: 3cd099862fa23d62258318b965d5ed2a35f83758
          path: digestor-fixture
          persist-credentials: false
      - name: Install isolated Digestor HTTP fixture dependencies
        if: github.ref == 'refs/heads/fix/fiscal-stamp-recovery'
        run: |
          python3 -m venv "$RUNNER_TEMP/digestor-fixture-venv"
          "$RUNNER_TEMP/digestor-fixture-venv/bin/pip" install --index-url https://pypi.org/simple --only-binary=:all: -r digestor-fixture/requirements.txt -r digestor-fixture/requirements.fiscal-test.txt
      - name: Real HTTP and SQL recovery with synthetic provider
        if: github.ref == 'refs/heads/fix/fiscal-stamp-recovery'
        run: |
          DIGESTOR_FIXTURE_ROOT="$GITHUB_WORKSPACE/digestor-fixture" \
          DIGESTOR_FIXTURE_PYTHON="$RUNNER_TEMP/digestor-fixture-venv/bin/python" \
          node scripts/check_invoice_recovery.mjs
