name: Mercado Libre tenant pilot
on:
  push:
    branches: [feat/mercadolibre-sales-inbox]
  pull_request:
    branches: [main]
    paths: ['cotiza-web/lib/integrations/mercadolibre/**', 'cotiza-web/app/api/integrations/mercadolibre/**', 'cotiza-web/components/integraciones/**', 'cotiza-web/components/configuracion/**', 'cotiza-web/app/(dashboard)/configuracion/**', 'cotiza-web/app/api/settings/tenant-*/**', 'cotiza-web/lib/db/tenant-*.ts', 'cotiza-web/lib/auth/tenant-configuration.ts', 'cotiza-web/lib/tenant-*.ts', 'cotiza-web/prisma/manual/20261109_*.sql', 'scripts/check_*_ui.mjs', '.github/workflows/mercadolibre-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: cotiza_ml_synthetic
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:synthetic-local-only@127.0.0.1:5432/cotiza_ml_synthetic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix cotiza-web run db:generate
      - run: ./cotiza-web/node_modules/.bin/tsc --noEmit --project cotiza-web/tsconfig.json
      - run: npm --prefix cotiza-web test -- --maxWorkers=2 --exclude validate-quote-lifecycle.e2e.test.ts --reporter=dot
      - name: PostgreSQL isolation, idempotency, OAuth replay and refresh concurrency
        run: npm --prefix cotiza-web test -- lib/integrations/mercadolibre/store.integration.test.ts lib/db/tenant-operation.integration.test.ts --maxWorkers=1
        env:
          COTIZA_ML_TEST_DATABASE_URL: postgresql://postgres:synthetic-local-only@127.0.0.1:5432/cotiza_ml_synthetic
      - run: npm --prefix cotiza-web run build
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/ml-ui-tools" --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/ml-ui-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Actual inbox with synthetic orders in desktop and mobile
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/ml-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ml-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_mercadolibre_ui.mjs
      - name: Tenant operation and optional channel in desktop and mobile
        run: |
          ESBUILD_MODULE="$RUNNER_TEMP/ml-ui-tools/node_modules/esbuild" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ml-ui-tools/node_modules/playwright/index.mjs" \
          node scripts/check_tenant_operation_ui.mjs
      - name: Upload synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mercadolibre-visual-synthetic
          path: |
            artifacts/mercadolibre
            artifacts/tenant-operation
          retention-days: 3
          if-no-files-found: warn
