name: Diagnose public SAT form
on:
  push:
    branches: [diagnose/sat-portal-fields]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Compare QR prefix using public CFDI fixture
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.parse import urlparse
          from html.parser import HTMLParser
          import re
          base='https://verificacfdi.facturaelectronica.sat.gob.mx/default.aspx'
          import ssl, subprocess, tempfile
          host=urlparse(base).netloc
          chain=subprocess.run(['openssl','s_client','-connect',host+':443','-servername',host,'-showcerts','-verify_return_error','-verify_hostname',host],input='',capture_output=True,text=True,timeout=25)
          leaf=re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',chain.stdout,re.S).group()
          issuerUrl='https://secure.globalsign.com/cacert/gsrsaovsslca2018.crt'
          with urlopen(issuerUrl,timeout=25) as response: issuer=response.read()
          issuerPem=issuer.decode() if issuer.startswith(b'-----BEGIN') else ssl.DER_cert_to_PEM_cert(issuer)
          with tempfile.TemporaryDirectory() as directory:
              leafpath=directory+'/leaf.pem'; issuerpath=directory+'/issuer.pem'
              open(leafpath,'w').write(leaf);open(issuerpath,'w').write(issuerPem)
              verified=subprocess.run(['openssl','verify','-purpose','sslserver','-verify_hostname',host,'-CApath','/etc/ssl/certs','-untrusted',issuerpath,leafpath],capture_output=True,text=True)
              print('CHAIN_VERIFICATION',verified.returncode,verified.stdout,verified.stderr)
              if verified.returncode: raise SystemExit(1)
          ctx=ssl.create_default_context()
          ctx.load_verify_locations(cadata=issuerPem)
          class Fields(HTMLParser):
              def __init__(self): super().__init__(); self.fields={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); name=a.get('id','')
                  if tag=='input' and name in ['ctl00_MainContent_TxtUUID','ctl00_MainContent_TxtRfcEmisor','ctl00_MainContent_TxtRfcReceptor']:
                      self.fields[name]=a.get('value','')
          # Public fixture: nodecfdi/cfdi-expresiones tests/unit/extractors/comprobante40.spec.ts
          query='id=04BF2854-FE7D-4377-9196-71248F060ABB&re=CSM190311AH6&rr=MCI7306249Y1&tt=459.36&fe=5tSZhA=='
          for label,prefix in [('without_separator','?'),('with_separator','?&')]:
              with urlopen(base+prefix+query,timeout=25,context=ctx) as response:
                  html=response.read(500000).decode('utf-8',errors='replace')
                  parser=Fields();parser.feed(html)
                  print('PREFIX_RESULT',label,'HTTP',response.status,'FIELDS',parser.fields)
                  print('RESULT_PANEL',label,'ctl00_MainContent_PnlResultados' in html)
          PY
