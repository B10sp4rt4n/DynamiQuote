name: Tenant fiscal sandbox
on:
  push:
    branches: [feat/tenant-fiscal-sandbox]
  pull_request:
    branches: [main]
    paths: ['cotiza-web/lib/integrations/digestor-*.ts', 'cotiza-web/lib/integrations/proposal-payments*.ts', 'cotiza-web/app/api/proposals/**/invoice/payments/**', 'cotiza-web/app/(dashboard)/layout*', '.github/workflows/tenant-fiscal-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix cotiza-web run db:generate
      - run: ./cotiza-web/node_modules/.bin/tsc --noEmit --project cotiza-web/tsconfig.json
      - run: npm --prefix cotiza-web test -- --maxWorkers=2 --exclude validate-quote-lifecycle.e2e.test.ts --reporter=dot
      - run: npm --prefix cotiza-web run build
